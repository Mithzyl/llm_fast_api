services:
  fastapi-app:
    build: .
    container_name: fastapi_app_container
    volumes:
      - ./src:/app/src
      - ./src/key.json:/app/key.json
      - ./src/model_url_config.json:/app/src/model_url_config.json
      - ./src/config.yaml:/app/src/config.yaml
      - ./db.db:/app/db.db
      - ./src/files:/app/src/files
    ports:
      - "8000:8000"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_container
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fastapi-app
    restart: unless-stopped
