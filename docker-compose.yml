version: '3.8'

services:
  fastapi-app:
    build: .
    container_name: fastapi_app_container
    volumes:
      - ./src:/app/src
      - ./src/key.json:/app/key.json
      - ./src/model_url_config.json:/app/src/model_url_config.json
      - ./src/config.yaml:/app/src/config.yaml
      - ./db.db:/app/db.db
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_container
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fastapi-app
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
